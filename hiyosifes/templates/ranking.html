
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランキング</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: sans-serif;
            color: white;
            background:
                radial-gradient(ellipse at top, #492078 0%, transparent 60%),
                linear-gradient(135deg, #351c59, #180d2e);
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            margin: 0;
            color: #65f0ff;
            font-size: clamp(2rem, 7vw, 3.5rem);
            letter-spacing: 0.12em;
            text-shadow: 0 0 12px #00d9ff, 0 0 28px #00d9ff;
        }

        .subtitle {
            margin-top: 14px;
            color: #d5c8f2;
            font-size: 1rem;
            letter-spacing: 0.25em;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: auto auto;
            align-items: center;
            gap: 12px 16px;
            padding: 24px;
            border: 2px solid rgba(220, 210, 255, 0.8);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        .player-info {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-width: 0;
        }

        .player-rank {
            font-size: 1.5rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .player-score {
            grid-column: 1;
            grid-row: 2;
            padding-left: 4px;
            color: #72f0ff;
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .delete-one {
            grid-column: 2;
            grid-row: 1 / 3;
            justify-self: end;
            align-self: center;
            padding: 14px 18px;
            border: 2px solid #ff648c;
            border-radius: 14px;
            background: #35132f;
            color: #ffb0c5;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .delete-one:hover {
            background: #692044;
            transform: scale(1.04);
        }

        .delete-one:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
        }

        /* 1位 */
        .rank-1 {
            border-color: #ffdc70;
            background: linear-gradient(
                120deg,
                rgba(255, 200, 70, 0.2),
                rgba(255, 255, 255, 0.035)
            );
            box-shadow: 0 0 14px rgba(255, 210, 80, 0.12);
        }

        .rank-1 .player-rank,
        .rank-1 .player-score {
            color: #ffdf78;
        }

        /* 2位 */
        .rank-2 {
            border-color: #d6d9ee;
        }

        /* 3位 */
        .rank-3 {
            border-color: #d99c82;
        }

        .empty-message {
            padding: 35px 20px;
            border: 2px solid rgba(220, 210, 255, 0.5);
            border-radius: 20px;
            color: #d5c8f2;
            text-align: center;
        }

        .back-link {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 14px 24px;
            border: 2px solid #65eaff;
            border-radius: 14px;
            color: #65eaff;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .back-link:hover {
            background: rgba(101, 234, 255, 0.12);
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 12px;
            }

            header {
                margin-bottom: 35px;
            }

            .player {
                padding: 18px 14px;
                gap: 10px;
                border-radius: 20px;
            }

            .player-info {
                gap: 8px;
            }

            .player-rank {
                font-size: 1.2rem;
            }

            .player-name {
                font-size: 1.2rem;
            }

            .delete-one {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>ランキング</h1>
            <div class="subtitle">SCORE RANKING</div>
        </header>

        <section class="ranking-list">
            {% for player in rankings %}
                <div class="player
                    {% if loop.index == 1 %}rank-1
                    {% elif loop.index == 2 %}rank-2
                    {% elif loop.index == 3 %}rank-3
                    {% endif %}">

                    <div class="player-info">
                        <span class="player-rank">
                            {% if loop.index == 1 %}
                                ★ 1位
                            {% elif loop.index == 2 %}
                                ★ 2位
                            {% elif loop.index == 3 %}
                                ★ 3位
                            {% else %}
                                {{ loop.index }}位
                            {% endif %}
                        </span>

                        <span class="player-name">
                            {{ player.player_name }}
                        </span>
                    </div>

                    <div class="player-score">
                        {{ "{:,}".format(player.score) }} 点
                    </div>

                    <button
                        type="button"
                        class="delete-one"
                        onclick="deleteRanking(this, {{ player.id }}, {{ loop.index }})"
                    >
                        削除
                    </button>
                </div>
            {% else %}
                <div class="empty-message">
                    まだランキングが登録されていません。
                </div>
            {% endfor %}
        </section>

        <a href="/" class="back-link">得点カウンターに戻る</a>
    </main>

    <script>
        async function deleteRanking(button, id, rank) {
            if (!confirm(
                rank + "位のランキングを削除しますか？\n" +
                "この操作は取り消せません。"
            )) {
                return;
            }

            const password = prompt("管理用パスワードを入力してください");

            if (password === null || password === "") {
                return;
            }

            button.disabled = true;
            button.textContent = "削除中...";

            try {
                const response = await fetch("/delete_ranking/" + id, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.error || "削除に失敗しました");
                    button.disabled = false;
                    button.textContent = "削除";
                    return;
                }

                alert("ランキングを削除しました");
                location.reload();

            } catch (error) {
                console.error(error);
                alert("通信エラーが発生しました。時間をおいて再度お試しください。");
                button.disabled = false;
                button.textContent = "削除";
            }
        }
    </script>
</body>
</html>
